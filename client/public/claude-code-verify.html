<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Code 订阅验证</title>
    <style>
      :root {
        --bg: #f5f7fb; --card: #ffffff; --text: #18212f; --muted: #5b6574;
        --border: #dbe2ea; --primary: #d97706; --success: #147d45;
        --success-bg: #edf9f1; --error: #b42318; --error-bg: #fff0ee;
        --info: #1d4ed8; --info-bg: #eef4ff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif; background: linear-gradient(180deg, #f8fafc 0%, #fff5ee 100%); color: var(--text); }
      .page { max-width: 880px; margin: 0 auto; padding: 32px 20px 40px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08); overflow: hidden; }
      .hero { padding: 28px 28px 22px; border-bottom: 1px solid var(--border); }
      .hero h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.2; }
      .hero p { margin: 0; color: var(--muted); line-height: 1.6; }
      .content { padding: 24px 28px 28px; display: grid; gap: 16px; }
      .panel { border: 1px solid var(--border); border-radius: 16px; padding: 18px; background: #fff; }
      .panel h2 { margin: 0 0 10px; font-size: 17px; }
      .status { border-radius: 14px; padding: 14px 16px; line-height: 1.6; font-size: 14px; }
      .status.info { background: var(--info-bg); color: var(--info); }
      .status.success { background: var(--success-bg); color: var(--success); }
      .status.error { background: var(--error-bg); color: var(--error); }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--border); background: #fff; color: var(--text); text-decoration: none; cursor: pointer; font-size: 14px; font-weight: 600; }
      .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }
      .hint { color: var(--muted); font-size: 13px; line-height: 1.6; }
      .meta { display: grid; gap: 10px; color: var(--muted); line-height: 1.6; }
      .meta strong { color: var(--text); }
      .hidden { display: none; }
      textarea { width: 100%; min-height: 110px; border-radius: 12px; border: 1px solid var(--border); padding: 10px 12px; font-size: 13px; line-height: 1.6; resize: vertical; }
      @media (max-width: 640px) { .page { padding: 16px 12px 24px; } .hero, .content { padding-left: 16px; padding-right: 16px; } }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="hero">
          <h1>Claude Code 订阅验证</h1>
          <p>使用 Claude.ai 订阅账号授权。生成 OAuth 链接 → 在 claude.ai 完成登录 → 粘贴回调地址完成令牌写入。</p>
        </div>
        <div class="content">
          <div id="status" class="status info">准备开始 Claude Code 授权...</div>

          <div class="panel">
            <h2>步骤 1：生成授权链接</h2>
            <div class="actions">
              <button id="start-btn" class="btn primary" type="button">生成授权链接</button>
              <a id="auth-link" class="btn hidden" href="#" onclick="window.open(this.href, '_blank'); return false;" rel="noreferrer">打开 Claude 授权页</a>
            </div>
            <div class="hint" style="margin-top: 10px;">
              完成授权后浏览器会跳到 localhost:54545 回调地址（可能显示不可访问）。这是正常的，请复制该地址栏完整 URL。
            </div>
          </div>

          <div id="exchange-panel" class="panel hidden">
            <h2>步骤 2：粘贴回调地址并兑换令牌</h2>
            <textarea id="callback-url" placeholder="粘贴包含 code=... 的完整回调 URL（例如 http://localhost:54545/callback?code=xxx&state=xxx）"></textarea>
            <div class="actions" style="margin-top: 10px;">
              <button id="exchange-btn" class="btn primary" type="button">立即验证</button>
            </div>
          </div>

          <div id="result-panel" class="panel hidden">
            <h2>验证结果</h2>
            <div id="result-meta" class="meta"></div>
            <div class="actions" style="margin-top: 12px;">
              <button id="close-btn" class="btn primary" type="button">关闭窗口</button>
              <a class="btn" href="/">返回主页面</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const providerId = 'claude_code';
      const statusEl = document.getElementById('status');
      const startBtn = document.getElementById('start-btn');
      const authLink = document.getElementById('auth-link');
      const exchangePanel = document.getElementById('exchange-panel');
      const callbackUrlInput = document.getElementById('callback-url');
      const exchangeBtn = document.getElementById('exchange-btn');
      const resultPanel = document.getElementById('result-panel');
      const resultMeta = document.getElementById('result-meta');
      const closeBtn = document.getElementById('close-btn');

      let authCompleted = false;
      let statusPollTimer = null;

      function setStatus(type, message) { statusEl.className = `status ${type}`; statusEl.textContent = message; }
      function setHidden(el, hidden) { el.classList.toggle('hidden', hidden); }

      function postBack(type, message) {
        try { localStorage.setItem('provider-oauth-result', JSON.stringify({ type, providerId, message, ts: Date.now() })); } catch {}
        if (window.opener && !window.opener.closed) { window.opener.postMessage({ type, providerId, message }, window.location.origin); }
      }

      async function fetchJson(url, options, timeoutMs = 20000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, { ...(options || {}), signal: controller.signal });
          const data = await res.json().catch(() => ({}));
          return { ok: res.ok, data };
        } finally { clearTimeout(timer); }
      }

      async function startOAuth() {
        setStatus('info', '正在生成 Claude Code 授权链接...');
        startBtn.disabled = true;
        try {
          const result = await fetchJson('/api/auth/claude/code/start', { method: 'POST' });
          if (!result.ok || !result.data?.url) throw new Error(result.data?.error || '生成授权链接失败');
          authLink.href = result.data.url;
          setHidden(authLink, false);
          setHidden(exchangePanel, false);
          setStatus('success', '授权链接已就绪，请先在 claude.ai 完成授权，再粘贴回调地址进行验证。');
        } catch (e) { setStatus('error', e.message || '启动授权失败'); }
        finally { startBtn.disabled = false; }
      }

      async function exchangeToken() {
        const callbackUrl = callbackUrlInput.value.trim();
        if (!callbackUrl) { setStatus('error', '请先粘贴回调地址'); return; }
        exchangeBtn.disabled = true;
        setStatus('info', '正在兑换 Claude Code 订阅令牌...');
        try {
          const result = await fetchJson('/api/auth/claude/code/exchange', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ callbackUrl }),
          });
          if (!result.ok || !result.data?.success) throw new Error(result.data?.error || 'Claude Code 验证失败');
          authCompleted = true;
          stopStatusPolling();
          setHidden(resultPanel, false);
          resultMeta.innerHTML = '<div><strong>结果：</strong>Claude Code 订阅验证成功。</div>';
          setStatus('success', 'Claude Code 订阅验证成功。');
          postBack('provider-oauth-success', 'Claude Code 订阅验证成功。');
        } catch (e) {
          setHidden(resultPanel, false);
          resultMeta.innerHTML = `<div><strong>错误：</strong>${String(e.message || '验证失败')}</div>`;
          setStatus('error', e.message || '验证失败');
          postBack('provider-oauth-error', `Claude Code 订阅验证失败：${e.message || '未知错误'}`);
        } finally { exchangeBtn.disabled = false; }
      }

      function startStatusPolling() {
        if (statusPollTimer) return;
        statusPollTimer = setInterval(async () => {
          if (authCompleted) { stopStatusPolling(); return; }
          try {
            const res = await fetch('/api/auth/status/claude_code');
            if (!res.ok) return;
            const data = await res.json();
            if (data.authenticated && !data.expired) {
              stopStatusPolling();
              if (authCompleted) return;
              authCompleted = true;
              setHidden(resultPanel, false);
              resultMeta.innerHTML = '<div><strong>结果：</strong>Claude Code 订阅验证成功。</div>';
              setStatus('success', 'Claude Code 订阅验证成功。');
              postBack('provider-oauth-success', 'Claude Code 订阅验证成功。');
            }
          } catch {}
        }, 5000);
      }

      function stopStatusPolling() {
        if (statusPollTimer) { clearInterval(statusPollTimer); statusPollTimer = null; }
      }

      async function init() {
        try {
          const res = await fetch('/api/auth/status/claude_code');
          if (res.ok) {
            const data = await res.json();
            if (data.authenticated && !data.expired) {
              authCompleted = true;
              setHidden(resultPanel, false);
              resultMeta.innerHTML = '<div><strong>结果：</strong>Claude Code 订阅验证成功。</div>';
              setStatus('success', 'Claude Code 订阅验证成功。');
              postBack('provider-oauth-success', 'Claude Code 订阅验证成功。');
              return;
            }
          }
        } catch {}
        startStatusPolling();
      }

      startBtn.addEventListener('click', startOAuth);
      exchangeBtn.addEventListener('click', exchangeToken);
      closeBtn.addEventListener('click', () => window.close());
      window.addEventListener('beforeunload', () => stopStatusPolling());

      init();
    </script>
  </body>
</html>
