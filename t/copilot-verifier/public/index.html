<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Copilot Verifier & Chat</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: #f6f8fa;
        margin: 0;
        padding: 20px;
        color: #24292f;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        box-shadow: 0 3px 6px rgba(140, 149, 159, 0.15);
        overflow: hidden;
      }
      .header {
        padding: 16px;
        border-bottom: 1px solid #d0d7de;
        background-color: #f6f8fa;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .header h1 {
        font-size: 16px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .auth-section {
        padding: 20px;
        border-bottom: 1px solid #d0d7de;
        background-color: #f3f4f6;
      }
      .auth-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }
      .btn-github {
        background-color: #24292f;
        color: white;
        border: 1px solid rgba(27, 31, 36, 0.15);
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        justify-content: center;
      }
      .btn-github:hover {
        background-color: #000;
      }
      .btn-github svg {
        fill: white;
        width: 16px;
        height: 16px;
      }

      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        color: #57606a;
        margin: 15px 0;
        font-size: 12px;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #d0d7de;
        margin: 0 10px;
      }

      .input-group {
        display: flex;
        gap: 10px;
      }
      input[type="password"] {
        flex: 1;
        padding: 5px 12px;
        font-size: 14px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        outline: none;
      }
      input:focus {
        border-color: #0969da;
        box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.3);
      }
      select {
        padding: 5px 12px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        font-size: 14px;
      }
      button {
        background-color: #2da44e;
        color: white;
        border: 1px solid rgba(27, 31, 36, 0.15);
        border-radius: 6px;
        padding: 5px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
      }
      button:hover {
        background-color: #2c974b;
      }
      button:disabled {
        background-color: #94d3a2;
        cursor: not-allowed;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        background: #e1e4e8;
        padding: 8px 12px;
        border-radius: 6px;
        display: none;
        margin-bottom: 10px;
        justify-content: space-between;
      }
      .user-profile {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .user-info img {
        width: 24px;
        height: 24px;
        border-radius: 50%;
      }
      .btn-logout {
        background-color: transparent;
        border: 1px solid #d0d7de;
        color: #cf222e;
        padding: 4px 8px;
        font-size: 12px;
      }
      .btn-logout:hover {
        background-color: #ffebe9;
      }

      .status {
        font-size: 12px;
        margin-top: 8px;
        color: #57606a;
      }
      .success {
        color: #1a7f37;
      }
      .error {
        color: #cf222e;
      }

      .chat-section {
        display: flex;
        flex-direction: column;
        height: 500px;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: white;
      }
      .message {
        margin-bottom: 16px;
        max-width: 85%;
      }
      .user-message {
        margin-left: auto;
        background-color: #e1f0ff;
        padding: 10px 14px;
        border-radius: 12px 12px 0 12px;
        color: #000;
      }
      .ai-message {
        margin-right: auto;
        background-color: #f6f8fa;
        padding: 10px 14px;
        border-radius: 12px 12px 12px 0;
        border: 1px solid #d0d7de;
        line-height: 1.5;
      }

      .input-area {
        padding: 16px;
        border-top: 1px solid #d0d7de;
        background-color: white;
        display: flex;
        gap: 10px;
      }
      textarea {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        resize: none;
        font-family: inherit;
        font-size: 14px;
        height: 40px;
      }
      .input-area button {
        background-color: #0969da;
      }
      .input-area button:hover {
        background-color: #0550ae;
      }
      .input-area button:disabled {
        background-color: #80b4f0;
      }

      code {
        background: #eff1f3;
        padding: 2px 4px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 13px;
      }
      pre {
        background: #24292f;
        color: #f6f8fa;
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 13px;
      }
      pre code {
        background: none;
        color: inherit;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>
          <svg
            height="24"
            aria-hidden="true"
            viewBox="0 0 16 16"
            version="1.1"
            width="24"
            data-view-component="true"
            style="fill: #24292f"
          >
            <path
              d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
            ></path>
          </svg>
          Copilot Verifier & Chat
        </h1>
        <select id="model-select">
          <optgroup label="GitHub Copilot">
            <option value="gpt-4o">GPT-4o</option>
            <option value="gpt-4">GPT-4</option>
            <option value="claude-3.5-sonnet">Claude 3.5 Sonnet</option>
            <option value="claude-3.7-sonnet">Claude 3.7 Sonnet</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
            <option value="o1-preview">OpenAI o1-preview</option>
            <option value="o3-mini">OpenAI o3-mini</option>
          </optgroup>
          <optgroup label="Other Providers (Require API Keys)">
            <option value="openai">OpenAI</option>
            <option value="kimi">Kimi (Moonshot)</option>
            <option value="minimax">MiniMax</option>
            <option value="qwen">Qwen (阿里云百炼)</option>
          </optgroup>
        </select>
      </div>

      <div class="auth-section">
        <div id="user-info-panel" class="user-info">
          <div class="user-profile">
            <img id="user-avatar" src="" alt="avatar" />
            <span id="user-name">Username</span>
          </div>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <div id="login-panel">
          <div style="margin-bottom: 15px; font-weight: bold">
            GitHub Copilot Authentication
          </div>
          <div class="auth-buttons">
            <button
              class="btn-github"
              id="device-flow-btn"
              onclick="startDeviceFlow()"
            >
              <svg viewBox="0 0 16 16">
                <path
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                ></path>
              </svg>
              Verify GitHub Copilot via Device
            </button>
            <button
              style="
                background-color: #6c5ce7;
                color: white;
                border: 1px solid rgba(27, 31, 36, 0.15);
                border-radius: 6px;
                padding: 8px 16px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                transition: 0.2s;
              "
              id="minimax-device-btn"
              onclick="startMiniMaxDeviceFlow()"
            >
              Login to MiniMax
            </button>
            <button
              style="
                background-color: #10a37f;
                color: white;
                border: 1px solid rgba(27, 31, 36, 0.15);
                border-radius: 6px;
                padding: 8px 16px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                transition: 0.2s;
              "
              id="openai-device-btn"
              onclick="startOpenAIFlow()"
            >
              Login to OpenAI / Codex
            </button>
          </div>
          <div
            id="device-flow-status"
            style="margin-top: 10px; font-size: 14px; display: none"
          ></div>
          <div class="divider">OR</div>
          <div class="input-group">
            <input
              type="password"
              id="gh-token"
              placeholder="Enter existing token (ghu_... or gho_...)"
              autocomplete="off"
            />
            <button id="verify-btn" onclick="verifyTokenManual()">
              Verify Manually
            </button>
          </div>

          <div class="divider">OTHER PROVIDERS (API KEYS)</div>
          <div class="input-group">
            <input
              type="password"
              id="api-key"
              placeholder="Enter API Key for OpenAI / Kimi / MiniMax / Qwen"
              autocomplete="off"
            />
            <button id="verify-api-key-btn" onclick="verifyApiKey()">
              Use API Key
            </button>
          </div>
        </div>

        <div id="auth-status" class="status">Waiting for authentication...</div>
      </div>

      <div class="chat-section">
        <div class="messages" id="chat-messages">
          <div class="message ai-message">
            Hello! Please authenticate with your GitHub account above to verify
            Copilot subscription and start chatting.
          </div>
        </div>
        <div class="input-area">
          <textarea
            id="chat-input"
            placeholder="Type a message..."
            disabled
          ></textarea>
          <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
      </div>
    </div>

    <script>
      let currentCopilotToken = null;
      let currentApiKey = null;
      let currentProvider = "copilot"; // 'copilot', 'openai', 'kimi', 'minimax'
      let chatHistory = [];

      // 页面加载时检查是否已登录
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          const res = await fetch("/api/me");
          const data = await res.json();

          if (data.loggedIn) {
            document.getElementById("login-panel").style.display = "none";
            document.getElementById("user-info-panel").style.display = "flex";
            document.getElementById("user-avatar").src = data.user.avatar_url;
            document.getElementById("user-name").textContent = data.user.login;

            const statusEl = document.getElementById("auth-status");

            if (data.hasCopilot) {
              currentCopilotToken = data.copilotToken;
              const tokenExpiresAt = new Date(data.expires_at * 1000);

              statusEl.innerHTML = `✅ Copilot verified for @${data.user.login}. Token valid until: ${tokenExpiresAt.toLocaleTimeString()}`;
              statusEl.className = "status success";

              enableChat();
              addMessageToUI(
                "System",
                "Authentication and Copilot verification successful.",
              );
            } else {
              statusEl.innerHTML = `❌ Verification failed: ${data.error}`;
              statusEl.className = "status error";
            }
          }
        } catch (e) {
          console.error("Session check failed", e);
        }
      });

      async function startDeviceFlow() {
        const btn = document.getElementById("device-flow-btn");
        const statusDiv = document.getElementById("device-flow-status");
        btn.disabled = true;

        try {
          const res = await fetch("/api/device/start", { method: "POST" });
          const data = await res.json();

          if (data.error) throw new Error(data.error);

          try {
            // Modern async clipboard API (requires secure context/HTTPS, or localhost)
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(data.user_code);
            } else {
                // Fallback for non-secure contexts (HTTP over IP)
                const textArea = document.createElement("textarea");
                textArea.value = data.user_code;
                textArea.style.position = "fixed";  // Avoid scrolling to bottom
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                document.body.removeChild(textArea);
            }
          } catch (e) {
            console.warn("clipboard error", e);
          }

          statusDiv.style.display = "block";
          statusDiv.innerHTML = `
                <div style="background: #e1f0ff; padding: 10px; border-radius: 6px; margin-bottom: 10px; color: #0550ae;">
                    ✨ Code <b>${data.user_code}</b> has been copied to your clipboard!
                </div>
                Please visit: <a href="${data.verification_uri}" target="_blank" style="color: #0969da; font-weight: bold;">${data.verification_uri}</a> <br>
                And paste the code: <span style="font-size: 18px; font-weight: bold; background: #e1e4e8; padding: 2px 6px; border-radius: 4px;">${data.user_code}</span><br>
                <span style="font-size: 12px; color: #57606a;">Waiting for authorization...</span>
            `;

          // 开始轮询检查
          pollDeviceFlow(data.device_code, data.interval);
        } catch (e) {
          statusDiv.style.display = "block";
          statusDiv.innerHTML = `<span style="color: #cf222e;">Failed to start: ${e.message}</span>`;
          btn.disabled = false;
        }
      }

      async function pollDeviceFlow(deviceCode, intervalSeconds) {
        const intervalMs = (intervalSeconds + 1) * 1000;

        const poll = setInterval(async () => {
          try {
            const res = await fetch("/api/device/poll", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ device_code: deviceCode }),
            });
            const data = await res.json();

            if (data.success) {
              clearInterval(poll);
              document.getElementById("device-flow-status").innerHTML =
                '<span style="color: #1a7f37;">✅ Authorization successful! Reloading...</span>';
              setTimeout(() => window.location.reload(), 1500);
            } else if (data.status === "authorization_pending") {
              // 继续等
            } else if (data.status === "expired_token") {
              clearInterval(poll);
              document.getElementById("device-flow-status").innerHTML =
                '<span style="color: #cf222e;">❌ Code expired. Please try again.</span>';
              document.getElementById("device-flow-btn").disabled = false;
            } else if (data.error) {
              clearInterval(poll);
              document.getElementById("device-flow-status").innerHTML =
                `<span style="color: #cf222e;">❌ Error: ${data.error}</span>`;
              document.getElementById("device-flow-btn").disabled = false;
            }
          } catch (e) {
            console.error("Poll error", e);
          }
        }, intervalMs);
      }
      // 添加 API Key 验证逻辑
      function verifyApiKey() {
        const key = document.getElementById("api-key").value.trim();
        const modelSelect = document.getElementById("model-select");
        const selectedModel = modelSelect.value;
        const statusEl = document.getElementById("auth-status");

        if (!key) {
          statusEl.textContent = "Please enter an API Key.";
          statusEl.className = "status error";
          return;
        }

        if (selectedModel === "openai") {
            currentProvider = "openai";
            statusEl.innerHTML = `✅ Authenticated with OpenAI API Key`;
        } else if (selectedModel === "kimi") {
            currentProvider = "kimi";
            statusEl.innerHTML = `✅ Authenticated with Kimi API Key`;
        } else if (selectedModel === "minimax") {
            currentProvider = "minimax";
            statusEl.innerHTML = `✅ Authenticated with MiniMax API Key`;
        } else if (selectedModel === "qwen") {
            currentProvider = "qwen";
            statusEl.innerHTML = `✅ Authenticated with Qwen (Aliyun) API Key`;
        } else {
             statusEl.textContent = "Please select a matching provider from the dropdown first (OpenAI/Kimi/MiniMax/Qwen).";
             statusEl.className = "status error";
             return;
        }

        currentApiKey = key;
        statusEl.className = "status success";

        document.getElementById("login-panel").style.display = "none";
        document.getElementById("user-info-panel").style.display = "flex";
        document.getElementById("user-name").textContent = `API Key: ${currentProvider}`;
        document.getElementById("user-avatar").src = "https://ui-avatars.com/api/?name=API+Key&background=0D8ABC&color=fff";

        enableChat();
        addMessageToUI("System", `Successfully switched to ${currentProvider.toUpperCase()} provider.`);
      }

      async function startOpenAIFlow() {
        const btn = document.getElementById("openai-device-btn");
        const statusDiv = document.getElementById("device-flow-status");
        btn.disabled = true;

        try {
          const res = await fetch("/api/openai/start", { method: "POST" });
          const data = await res.json();

          if (data.error) throw new Error(data.error);

          statusDiv.style.display = "block";
          statusDiv.innerHTML = `
                <div style="background: #e1f0ff; padding: 10px; border-radius: 6px; margin-bottom: 10px; color: #0550ae; font-size:13px;">
                    ✨ <b>Please click the link below to authorize.</b><br>
                    <span style="font-size:12px; color:#57606a;">After you log in to OpenAI, the page will say "This site can't be reached" (127.0.0.1 refused to connect).<br>
                    <b>THIS IS EXPECTED!</b> Just copy the entire URL from your browser's address bar and paste it below.</span>
                </div>
                <a href="${data.url}" target="_blank" style="display:inline-block; padding:6px 12px; background:#10a37f; color:white; text-decoration:none; border-radius:4px; margin-bottom:10px;">Authorize with OpenAI</a><br>
                <input type="text" id="openai-callback-url" placeholder="Paste the http://localhost:1455/?code=... URL here" style="width:100%; box-sizing:border-box; padding:8px; border:1px solid #d0d7de; border-radius:4px; margin-bottom:8px;" />
                <button onclick="submitOpenAICallback()" style="width:100%; background:#0969da;">Submit URL</button>
            `;

        } catch (e) {
          statusDiv.style.display = "block";
          statusDiv.innerHTML = `<span style="color: #cf222e;">Failed to start OpenAI flow: ${e.message}</span>`;
          btn.disabled = false;
        }
      }

      async function submitOpenAICallback() {
        const callbackUrl = document.getElementById("openai-callback-url").value.trim();
        const statusDiv = document.getElementById("device-flow-status");
        if (!callbackUrl) return;
        
        statusDiv.innerHTML = `<span style="color: #57606a;">Exchanging token with OpenAI...</span>`;

        try {
            const res = await fetch("/api/openai/exchange", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ callbackUrl })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById("device-flow-status").innerHTML = '<span style="color: #1a7f37;">✅ OpenAI/Codex Authorization successful!</span>';
                
                // 为了与后面匹配，直接把 provider 设成 'codex' 或 'openai'
                currentProvider = "codex";
                currentApiKey = data.token;
                
                // 自动选择 OpenAI 组里对应的模型
                document.getElementById("model-select").value = "openai"; 
                
                document.getElementById("login-panel").style.display = "none";
                document.getElementById("user-info-panel").style.display = "flex";
                document.getElementById("user-name").textContent = `OpenAI ChatGPT Account`;
                document.getElementById("user-avatar").src = "https://ui-avatars.com/api/?name=Open+AI&background=10a37f&color=fff";

                enableChat();
                addMessageToUI("System", `Successfully logged into OpenAI! Ready to chat using your account quota.`);
            } else {
                throw new Error(data.error || "Unknown error");
            }
        } catch (e) {
            statusDiv.innerHTML = `<span style="color: #cf222e;">❌ Error: ${e.message}</span>`;
            document.getElementById("openai-device-btn").disabled = false;
        }
      }

      async function startMiniMaxDeviceFlow() {
        const btn = document.getElementById("minimax-device-btn");
        const statusDiv = document.getElementById("device-flow-status");
        btn.disabled = true;

        try {
          const res = await fetch("/api/minimax/start", { method: "POST" });
          const data = await res.json();

          if (data.error) throw new Error(data.error);

          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(data.user_code);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = data.user_code;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                } catch (err) {}
                document.body.removeChild(textArea);
            }
          } catch (e) {}

          statusDiv.style.display = "block";
          statusDiv.innerHTML = `
                <div style="background: #e1f0ff; padding: 10px; border-radius: 6px; margin-bottom: 10px; color: #0550ae;">
                    ✨ MiniMax Code <b>${data.user_code}</b> has been copied to your clipboard!
                </div>
                Please visit: <a href="${data.verification_uri}" target="_blank" style="color: #0969da; font-weight: bold;">${data.verification_uri}</a> <br>
                And paste the code: <span style="font-size: 18px; font-weight: bold; background: #e1e4e8; padding: 2px 6px; border-radius: 4px;">${data.user_code}</span><br>
                <span style="font-size: 12px; color: #57606a;">Waiting for MiniMax authorization...</span>
            `;

          pollMiniMaxDeviceFlow(data.user_code, data.interval || 2);
        } catch (e) {
          statusDiv.style.display = "block";
          statusDiv.innerHTML = `<span style="color: #cf222e;">Failed to start MiniMax flow: ${e.message}</span>`;
          btn.disabled = false;
        }
      }

      async function pollMiniMaxDeviceFlow(userCode, intervalSeconds) {
        const intervalMs = intervalSeconds * 1000;

        const poll = setInterval(async () => {
          try {
            const res = await fetch("/api/minimax/poll", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user_code: userCode }),
            });
            const data = await res.json();

            if (data.success) {
              clearInterval(poll);
              document.getElementById("device-flow-status").innerHTML =
                '<span style="color: #1a7f37;">✅ MiniMax Authorization successful! Switching...</span>';

              // 登录成功后直接切换到 MiniMax
              currentProvider = "minimax";
              currentApiKey = data.token; // 我们复用 apiKey 字段来存任何平台原生的 Token

              document.getElementById("model-select").value = "minimax";
              document.getElementById("login-panel").style.display = "none";
              document.getElementById("user-info-panel").style.display = "flex";
              document.getElementById("user-name").textContent = `MiniMax Account`;
              document.getElementById("user-avatar").src = "https://ui-avatars.com/api/?name=Mini+Max&background=6c5ce7&color=fff";

              enableChat();
              addMessageToUI("System", `Successfully logged into MiniMax! Ready to chat.`);
            } else if (data.status === "authorization_pending") {
              // 继续等
            } else if (data.error) {
              clearInterval(poll);
              document.getElementById(
                "device-flow-status"
              ).innerHTML = `<span style="color: #cf222e;">❌ Error: ${data.error}</span>`;
              document.getElementById("minimax-device-btn").disabled = false;
            }
          } catch (e) {
            console.error("Poll error", e);
          }
        }, intervalMs);
      }
      async function verifyTokenManual() {
        const ghToken = document.getElementById("gh-token").value.trim();
        const statusEl = document.getElementById("auth-status");
        const verifyBtn = document.getElementById("verify-btn");

        if (!ghToken) {
          statusEl.textContent = "Please enter a token first.";
          statusEl.className = "status error";
          return;
        }

        verifyBtn.disabled = true;
        statusEl.textContent = "Verifying manually...";

        try {
          const res = await fetch("/api/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ githubToken: ghToken }),
          });

          const data = await res.json();

          if (res.ok && data.success) {
            // 如果是手动验证成功，刷新页面以拉取用户信息
            window.location.reload();
          } else {
            statusEl.textContent = `❌ Verification failed: ${data.error}`;
            statusEl.className = "status error";
          }
        } catch (error) {
          statusEl.textContent = `❌ Network error: ${error.message}`;
          statusEl.className = "status error";
        } finally {
          verifyBtn.disabled = false;
        }
      }

      async function logout() {
        await fetch("/api/logout", { method: "POST" });
        window.location.reload();
      }

      function enableChat() {
        document.getElementById("chat-input").disabled = false;
        document.getElementById("send-btn").disabled = false;
      }

      async function sendMessage() {
        const inputEl = document.getElementById("chat-input");
        const sendBtn = document.getElementById("send-btn");
        const message = inputEl.value.trim();
        const model = document.getElementById("model-select").value;

        if (!message) return;
        if (currentProvider === "copilot" && !currentCopilotToken) return;
        if (currentProvider !== "copilot" && !currentApiKey) return;

        addMessageToUI("user", message);
        chatHistory.push({ role: "user", content: message });

        inputEl.value = "";
        inputEl.disabled = true;
        sendBtn.disabled = true;

        const messagesDiv = document.getElementById("chat-messages");
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message ai-message";
        loadingDiv.id = "loading-msg";
        loadingDiv.textContent = "Thinking...";
        messagesDiv.appendChild(loadingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              provider: currentProvider,
              token: currentProvider === "copilot" ? currentCopilotToken : currentApiKey,
              model: model,
              messages: chatHistory,
            }),
          });

          const data = await res.json();
          document.getElementById("loading-msg").remove();

          if (res.ok && data.choices && data.choices.length > 0) {
            const aiResponse = data.choices[0].message.content;
            chatHistory.push({ role: "assistant", content: aiResponse });

            const formattedResponse = aiResponse
              .replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>")
              .replace(/`([^`]+)`/g, "<code>$1</code>")
              .replace(/\n/g, "<br>");

            addMessageToUI("ai", formattedResponse, true);
          } else {
            addMessageToUI("ai", `❌ Error: ${data.error || "Unknown error"}`);
          }
        } catch (error) {
          document.getElementById("loading-msg").remove();
          addMessageToUI("ai", `❌ Request failed: ${error.message}`);
        } finally {
          inputEl.disabled = false;
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      function addMessageToUI(sender, text, isHtml = false) {
        const messagesDiv = document.getElementById("chat-messages");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender === "user" ? "user-message" : "ai-message"}`;

        if (isHtml) {
          msgDiv.innerHTML = text;
        } else {
          msgDiv.textContent = text;
        }

        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      document
        .getElementById("chat-input")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
    </script>
  </body>
</html>
